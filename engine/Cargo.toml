[package]
name = "quorum_engine"
version = "0.1.0"
edition = "2021"
description = "High-accuracy multiscale physics engine for zeolite ion-exchange screening"

[lib]
name = "quorum_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "=0.23.5", features = ["extension-module"] }
ndarray = "=0.16.1"
rayon = "=1.10.0"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
thiserror = "=2.0.12"
levenberg-marquardt = "=0.14.0"
sled = "=0.34.7"

[build-dependencies]
pyo3-build-config = "=0.23.5"
